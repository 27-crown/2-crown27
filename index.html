<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>欢迎来到我的旅游剧本</title>
  <style>
    @font-face {
      font-family: 'LXGW WenKai';
      src: url('assets/lxgw-wenkai-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #030712;
      --bg2: #07111f;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --violet: #a855f7;
      --amber: #fbbf24;
      --text: #e6f6ff;
      --muted: #8fb4c7;
      --kaiti: 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--kaiti);
      user-select: none;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(34, 211, 238, 0.13), transparent 28%),
        radial-gradient(circle at 50% 70%, rgba(168, 85, 247, 0.12), transparent 35%),
        linear-gradient(160deg, #02030a 0%, #07111f 48%, #050713 100%);
      transform-origin: center;
      transition: opacity 1.35s ease, filter 1.35s ease, transform 1.35s ease;
    }

    #welcome.leave {
      opacity: 0;
      filter: blur(28px) saturate(0.5);
      transform: scale(1.12);
      pointer-events: none;
    }

    #welcome.done {
      display: none;
    }

    .welcome-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.95), transparent 72%);
      animation: grid-pulse 4.5s ease-in-out infinite;
    }

    @keyframes grid-pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.035); }
    }

    .welcome-core {
      position: relative;
      z-index: 2;
      width: min(92vw, 960px);
      padding: 48px 24px;
      text-align: center;
    }

    .welcome-tag {
      margin-bottom: 24px;
      font-size: clamp(11px, 2.4vw, 16px);
      letter-spacing: 0.38em;
      color: #5eead4;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(45, 212, 191, 0.9);
    }

    #welcome-title {
      position: relative;
      margin: 0 auto;
      font-family: var(--kaiti);
      font-size: clamp(2.6rem, 8vw, 7rem);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: 0.06em;
      color: #effcff;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.95),
        0 0 22px rgba(34, 211, 238, 0.95),
        0 0 46px rgba(59, 130, 246, 0.85),
        0 0 90px rgba(168, 85, 247, 0.7);
      animation: title-arrive 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #welcome-title::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 68%;
      height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, #67e8f9, #a78bfa, transparent);
      filter: drop-shadow(0 0 10px #22d3ee);
      animation: line-glow 2s ease-in-out infinite;
    }

    @keyframes title-arrive {
      0% { opacity: 0; transform: translateY(22px) scale(0.92); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes line-glow {
      0%, 100% { opacity: 0.55; width: 62%; }
      50% { opacity: 1; width: 76%; }
    }

    .welcome-sub {
      margin-top: 46px;
      font-size: clamp(14px, 3.2vw, 24px);
      letter-spacing: 0.24em;
      color: #a5d9e8;
      text-shadow: 0 0 18px rgba(34, 211, 238, 0.75);
      animation: sub-arrive 1.1s 0.25s ease-out both;
    }

    @keyframes sub-arrive {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .smoke {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(170, 205, 255, 0.14), rgba(125, 211, 252, 0.06) 34%, transparent 68%);
      filter: blur(18px);
      mix-blend-mode: screen;
      animation: smoke-rise var(--dur) ease-out forwards;
      animation-delay: var(--delay);
      opacity: 0;
    }

    @keyframes smoke-rise {
      0% { opacity: 0; transform: translate(-50%, 40px) scale(0.15) rotate(0deg); }
      18% { opacity: 0.5; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -56vh) scale(2.1) rotate(var(--rot)); }
    }

    #welcome.leave .smoke {
      animation: smoke-disperse 1.35s ease-in forwards;
      animation-delay: 0s;
      opacity: 0.45;
    }

    @keyframes smoke-disperse {
      0% { opacity: 0.45; transform: translate(-50%, 0) scale(0.9) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--burst-x)), var(--burst-y)) scale(3.1) rotate(var(--rot)); filter: blur(34px); }
    }

    #app {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    #app.show {
      opacity: 1;
    }

    #bgCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      z-index: 5;
      top: max(18px, env(safe-area-inset-top));
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .brand {
      font-size: clamp(16px, 3.2vw, 26px);
      letter-spacing: 0.12em;
      color: #e8f8ff;
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.9);
    }

    .map-hint {
      padding: 9px 13px;
      border: 1px solid rgba(34, 211, 238, 0.35);
      border-radius: 999px;
      background: rgba(4, 18, 30, 0.58);
      color: #bae6fd;
      font-size: 12px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 16px rgba(34, 211, 238, 0.08), 0 0 18px rgba(34, 211, 238, 0.08);
    }

    .legend {
      position: absolute;
      z-index: 5;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      padding: 10px 16px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 999px;
      background: rgba(2, 8, 16, 0.58);
      backdrop-filter: blur(8px);
      color: #bae6fd;
      font-size: 12px;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 3, 8, 0.93);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #viewer.open {
      opacity: 1;
      visibility: visible;
    }

    .viewer-stage {
      position: relative;
      width: min(96vw, 1100px);
      height: min(88vh, 760px);
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(103, 232, 249, 0.28);
      background: #020810;
      box-shadow: 0 0 70px rgba(34, 211, 238, 0.13), inset 0 0 42px rgba(14, 116, 144, 0.08);
      touch-action: pan-y;
    }

    .viewer-track {
      position: absolute;
      inset: 0;
      display: flex;
      transition: transform 0.46s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .viewer-slide {
      flex: 0 0 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewer-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .info-card {
      position: relative;
      width: min(86vw, 560px);
      min-height: 330px;
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 26px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      background:
        radial-gradient(circle at 50% 15%, rgba(34, 211, 238, 0.16), transparent 46%),
        linear-gradient(160deg, rgba(8, 26, 42, 0.95), rgba(3, 10, 22, 0.95));
      box-shadow: 0 0 50px rgba(34, 211, 238, 0.2), inset 0 0 50px rgba(34, 211, 238, 0.06);
    }

    .info-card .city-name {
      font-size: clamp(34px, 9vw, 70px);
      letter-spacing: 0.12em;
      color: #effcff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 28px rgba(34, 211, 238, 0.95);
    }

    .info-card .status {
      margin-top: 24px;
      font-size: clamp(16px, 4vw, 24px);
      color: #7dd3fc;
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.75);
    }

    .viewer-meta {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #dff9ff;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
      pointer-events: none;
    }

    .viewer-city {
      font-size: clamp(20px, 5vw, 34px);
      letter-spacing: 0.12em;
    }

    .viewer-count {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #b7dcea;
    }

    .close-hint {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 5;
      color: rgba(214, 240, 255, 0.78);
      font-size: 12px;
      letter-spacing: 0.1em;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      z-index: 8;
      width: 44px;
      height: 72px;
      margin-top: -36px;
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 14px;
      background: rgba(4, 16, 27, 0.6);
      color: #bff2ff;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(34, 211, 238, 0.16);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
    }

    #prevBtn { left: 18px; }
    #nextBtn { right: 18px; }

    @media (max-width: 720px) {
      .topbar {
        top: 10px;
        left: 14px;
        right: 14px;
      }

      .map-hint {
        font-size: 10px;
        padding: 7px 10px;
      }

      .legend {
        bottom: 10px;
        font-size: 10px;
        gap: 6px 10px;
      }

      .viewer-stage {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .nav-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="welcome">
    <div class="welcome-grid"></div>
    <div class="welcome-core">
      <div class="welcome-tag">SYSTEM ONLINE // MY TRAVEL SCRIPT</div>
      <h1 id="welcome-title">欢迎来到我的旅游剧本</h1>
      <div class="welcome-sub">中国旅游地图</div>
    </div>
  </div>

  <div id="app">
    <canvas id="bgCanvas"></canvas>
    <div id="map"></div>
    <header class="topbar">
      <div class="brand">我的旅游剧本</div>
      <div class="map-hint">点击城市查看照片</div>
    </header>
    <div class="legend">
      <span><i></i>已有照片城市</span>
      <span><i style="background:transparent;border:1px solid var(--amber);box-shadow:0 0 10px var(--amber)"></i>照片待补充</span>
    </div>
  </div>

  <div id="viewer" aria-hidden="true">
    <div class="viewer-stage">
      <div class="viewer-track" id="viewerTrack"></div>
      <div class="viewer-meta">
        <div class="viewer-city" id="viewerCity"></div>
        <div class="viewer-count" id="viewerCount"></div>
      </div>
      <div class="close-hint">点击任意处退出</div>
    </div>
    <button class="nav-btn" id="prevBtn" aria-label="上一张">‹</button>
    <button class="nav-btn" id="nextBtn" aria-label="下一张">›</button>
  </div>

  <script src="assets/echarts.min.js"></script>
  <script src="assets/china-map.js"></script>
  <script src="assets/cities-data.js"></script>
  <script>
    (function () {
      const DATA = window.TRAVEL_DATA || { cities: [], noPhotoCities: [] };
      const welcome = document.getElementById('welcome');
      const app = document.getElementById('app');
      const mapEl = document.getElementById('map');
      const bgCanvas = document.getElementById('bgCanvas');
      const viewer = document.getElementById('viewer');
      const track = document.getElementById('viewerTrack');
      const viewerCity = document.getElementById('viewerCity');
      const viewerCount = document.getElementById('viewerCount');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      let chart = null;
      let viewerSlides = [];
      let viewerIndex = 0;
      let touchStartX = 0;
      let touchStartY = 0;

      function createSmoke() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 34; i++) {
          const s = document.createElement('span');
          s.className = 'smoke';
          const size = 120 + Math.random() * 250;
          s.style.setProperty('--size', size + 'px');
          s.style.setProperty('--dur', (3.2 + Math.random() * 3.8) + 's');
          s.style.setProperty('--delay', (Math.random() * 4.5) + 's');
          s.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
          s.style.setProperty('--rot', (Math.random() * 80 - 40) + 'deg');
          s.style.setProperty('--burst-x', (Math.random() * 520 - 260) + 'px');
          s.style.setProperty('--burst-y', (Math.random() * -520 - 80) + 'px');
          s.style.left = (42 + Math.random() * 16) + '%';
          s.style.bottom = (8 + Math.random() * 22) + '%';
          frag.appendChild(s);
        }
        welcome.appendChild(frag);
      }

      function initBackground() {
        const ctx = bgCanvas.getContext('2d');
        let w = 0;
        let h = 0;
        const particles = [];
        const mouse = { x: -9999, y: -9999 };

        function resize() {
          w = bgCanvas.width = window.innerWidth;
          h = bgCanvas.height = window.innerHeight;
          const count = Math.min(90, Math.floor((w * h) / 16000));
          particles.length = 0;
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.22,
              vy: (Math.random() - 0.5) * 0.22,
              r: Math.random() * 1.7 + 0.4,
              a: Math.random() * 0.55 + 0.12
            });
          }
        }

        function draw() {
          ctx.clearRect(0, 0, w, h);
          const linkDist = 135;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < -30) p.x = w + 30;
            if (p.x > w + 30) p.x = -30;
            if (p.y < -30) p.y = h + 30;
            if (p.y > h + 30) p.y = -30;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(56, 189, 248, ' + p.a + ')';
            ctx.shadowColor = 'rgba(56, 189, 248, 0.75)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;

            const dxm = p.x - mouse.x;
            const dym = p.y - mouse.y;
            if (dxm * dxm + dym * dym < 180 * 180) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = 'rgba(103, 232, 249, 0.16)';
              ctx.lineWidth = 0.7;
              ctx.stroke();
            }

            for (let j = i + 1; j < particles.length; j++) {
              const q = particles[j];
              const dx = p.x - q.x;
              const dy = p.y - q.y;
              const d = Math.hypot(dx, dy);
              if (d < linkDist) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = 'rgba(34, 211, 238, ' + (0.09 * (1 - d / linkDist)) + ')';
                ctx.lineWidth = 0.65;
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', function (e) {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });
        resize();
        draw();
      }

      function initMap() {
        chart = echarts.init(mapEl, null, { renderer: 'canvas' });
        echarts.registerMap('china', window.CHINA_GEO);

        const photoData = [];
        const missingData = [];
        const cityMap = {};
        DATA.cities.forEach(function (city) {
          const item = {
            name: city.name,
            short: city.short,
            value: [city.lng, city.lat, Math.max(4, (city.photos || []).length)],
            city: city
          };
          cityMap[city.name] = city;
          if (city.hasPhotos && city.photos && city.photos.length) {
            photoData.push(item);
          } else {
            missingData.push(item);
          }
        });

        const areaColor = new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(11, 32, 56, 0.92)' },
          { offset: 0.52, color: 'rgba(8, 20, 42, 0.88)' },
          { offset: 1, color: 'rgba(5, 14, 30, 0.92)' }
        ]);

        const option = {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(2, 12, 22, 0.88)',
            borderColor: 'rgba(34, 211, 238, 0.45)',
            borderWidth: 1,
            textStyle: {
              color: '#dff9ff',
              fontFamily: 'LXGW WenKai, Kaiti SC, STKaiti, KaiTi, 楷体, serif',
              fontSize: 13
            },
            formatter: function (p) {
              if (!p.data || !p.data.city) return p.name || '';
              const city = p.data.city;
              const count = city.photos ? city.photos.length : 0;
              if (city.hasPhotos && count) {
                return city.name + '<br/>' + count + ' 张照片';
              }
              return city.name + '<br/>已到达 · 照片待补充';
            }
          },
          geo: {
            map: 'china',
            roam: true,
            zoom: 1.22,
            center: [104.5, 35.5],
            layoutCenter: ['50%', '53%'],
            layoutSize: '96%',
            silent: false,
            itemStyle: {
              areaColor: areaColor,
              borderColor: 'rgba(56, 189, 248, 0.42)',
              borderWidth: 1,
              shadowBlur: 24,
              shadowColor: 'rgba(34, 211, 238, 0.24)'
            },
            emphasis: {
              label: { show: false },
              itemStyle: {
                areaColor: 'rgba(34, 211, 238, 0.13)',
                borderColor: 'rgba(103, 232, 249, 0.95)',
                borderWidth: 1.4,
                shadowBlur: 35,
                shadowColor: 'rgba(34, 211, 238, 0.45)'
              }
            },
            select: { disabled: true }
          },
          series: [
            {
              name: '照片城市',
              type: 'effectScatter',
              coordinateSystem: 'geo',
              data: photoData,
              zlevel: 2,
              rippleEffect: {
                period: 4,
                scale: 3.2,
                brushType: 'stroke'
              },
              symbol: 'circle',
              symbolSize: function (val) {
                return 9 + Math.min(15, (val[2] || 4) * 0.9);
              },
              itemStyle: {
                color: '#22d3ee',
                shadowBlur: 18,
                shadowColor: '#22d3ee',
                borderColor: '#d8fbff',
                borderWidth: 1
              },
              label: {
                show: true,
                position: 'right',
                distance: 9,
                color: '#e3faff',
                fontFamily: 'LXGW WenKai, Kaiti SC, STKaiti, KaiTi, 楷体, serif',
                fontSize: 13,
                fontWeight: 500,
                textShadowColor: '#22d3ee',
                textShadowBlur: 12,
                formatter: function (p) {
                  return p.data.short || p.data.name || '';
                }
              }
            },
            {
              name: '待补充城市',
              type: 'scatter',
              coordinateSystem: 'geo',
              data: missingData,
              zlevel: 2,
              symbol: 'circle',
              symbolSize: 14,
              itemStyle: {
                color: 'rgba(251, 191, 36, 0.10)',
                borderColor: '#fbbf24',
                borderWidth: 2,
                shadowBlur: 14,
                shadowColor: '#fbbf24'
              },
              label: {
                show: true,
                position: 'right',
                distance: 9,
                color: '#ffe4a6',
                fontFamily: 'LXGW WenKai, Kaiti SC, STKaiti, KaiTi, 楷体, serif',
                fontSize: 13,
                textShadowColor: '#fbbf24',
                textShadowBlur: 12,
                formatter: function (p) {
                  return p.data.short || p.data.name || '';
                }
              }
            }
          ]
        };

        chart.setOption(option);

        chart.on('click', function (params) {
          if (params.componentType === 'series' && params.data && params.data.city) {
            openCity(params.data.city);
          }
        });

        window.addEventListener('resize', function () {
          chart && chart.resize();
        });
      }

      function createSlide(city, photo, index) {
        const slide = document.createElement('div');
        slide.className = 'viewer-slide';
        const img = document.createElement('img');
        img.src = photo;
        img.alt = city.name + ' 照片 ' + (index + 1);
        img.loading = 'eager';
        slide.appendChild(img);
        return slide;
      }

      function createInfoSlide(city) {
        const slide = document.createElement('div');
        slide.className = 'viewer-slide';
        slide.innerHTML = '<div class="info-card">' +
          '<div class="city-name"></div>' +
          '<div class="status">已到达 · 照片待补充</div>' +
          '</div>';
        slide.querySelector('.city-name').textContent = city.name;
        return slide;
      }

      function buildViewer(city) {
        viewerSlides = [];
        track.innerHTML = '';
        if (city.hasPhotos && city.photos && city.photos.length) {
          city.photos.forEach(function (photo, i) {
            viewerSlides.push({ type: 'photo' });
            track.appendChild(createSlide(city, photo, i));
          });
        } else {
          viewerSlides.push({ type: 'info' });
          track.appendChild(createInfoSlide(city));
        }
        viewerCity.textContent = city.name;
        viewerIndex = 0;
        setViewerIndex(0);
      }

      function setViewerIndex(index, animate) {
        if (!viewerSlides.length) return;
        viewerIndex = Math.max(0, Math.min(viewerSlides.length - 1, index));
        track.style.transform = 'translateX(-' + (viewerIndex * 100) + '%)';
        if (viewerSlides.length > 1) {
          viewerCount.textContent = (viewerIndex + 1) + ' / ' + viewerSlides.length;
        } else {
          viewerCount.textContent = '点击退出';
        }
        if (animate) {
          track.classList.remove('animating');
          void track.offsetWidth;
          track.classList.add('animating');
        }
      }

      function openCity(city) {
        buildViewer(city);
        viewer.classList.add('open');
        viewer.setAttribute('aria-hidden', 'false');
      }

      // 暴露一个只读调用入口，便于自动化验证与后续调试。
      window.openTravelCity = openCity;

      function closeViewer() {
        viewer.classList.remove('open');
        viewer.setAttribute('aria-hidden', 'true');
        setTimeout(function () {
          track.innerHTML = '';
          viewerSlides = [];
        }, 320);
      }

      function nextSlide() {
        if (viewerSlides.length > 1 && viewerIndex < viewerSlides.length - 1) {
          setViewerIndex(viewerIndex + 1, true);
        }
      }

      function prevSlide() {
        if (viewerSlides.length > 1 && viewerIndex > 0) {
          setViewerIndex(viewerIndex - 1, true);
        }
      }

      function bindViewer() {
        viewer.addEventListener('click', function (e) {
          if (e.target === prevBtn || e.target === nextBtn) return;
          closeViewer();
        });
        nextBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          nextSlide();
        });
        prevBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          prevSlide();
        });

        viewer.addEventListener('touchstart', function (e) {
          touchStartX = e.changedTouches[0].clientX;
          touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        viewer.addEventListener('touchend', function (e) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) nextSlide();
            else prevSlide();
          }
        }, { passive: true });

        document.addEventListener('keydown', function (e) {
          if (!viewer.classList.contains('open')) return;
          if (e.key === 'Escape') closeViewer();
          if (e.key === 'ArrowRight') nextSlide();
          if (e.key === 'ArrowLeft') prevSlide();
        });
      }

      function runWelcome() {
        createSmoke();
        welcomeTitle = document.getElementById('welcome-title');
        if (DATA.welcomeTitle && welcomeTitle) welcomeTitle.textContent = DATA.welcomeTitle;

        setTimeout(function () {
          welcome.classList.add('leave');
          app.classList.add('show');
        }, 2000);

        setTimeout(function () {
          welcome.classList.add('done');
          initBackground();
          initMap();
        }, 3400);
      }

      let welcomeTitle = null;
      bindViewer();
      runWelcome();
    })();
  </script>
</body>
</html>
